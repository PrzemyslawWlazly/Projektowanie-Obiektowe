name: Zestaw 9 - Build

on:
  push:
    branches:
      - main
    paths:
      - "zestaw_9/**"
      - ".github/workflows/zestaw9-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "zestaw_9/**"
      - ".github/workflows/zestaw9-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zestaw9-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose -f zestaw_9/docker-compose.yml config

      - name: Build backend image
        run: docker build --tag zestaw9-backend:ci zestaw_9/backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg REACT_APP_API_URL=https://zestaw9-backend.onrender.com \
            --tag zestaw9-frontend:ci \
            zestaw_9/frontend

  email-notification:
    name: Send build result by email
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && github.event_name != 'pull_request' }}

    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Zestaw 9 - build ${{ needs.build.result }}
          to: ${{ secrets.MAIL_TO }}
          from: Zestaw 9 GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Wynik budowania: ${{ needs.build.result }}
            Repozytorium: ${{ github.repository }}
            Galaz: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            Szczegoly: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
